<header class="topbar">
  <div class="logo">MyApp</div>
  <nav class="topnav">
    <ul>
      <li *ngFor="let item of topMenuItems">
        <a [routerLink]="item.route" routerLinkActive="active">
          {{ item.label }}
        </a>
      </li>
    </ul>
    <button *ngIf="auth.isAuthenticated()" (click)="logout()">Logout</button>
  </nav>
</header>
