<div class="register-page">

  <form (ngSubmit)="register()" #registerForm="ngForm" class="register-card">

    <h2>Create account</h2>
    <p class="subtitle">It takes less than a minute</p>

    <!-- FIRST + LAST -->
    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="firstName" [(ngModel)]="firstName" #firstNameRef="ngModel" required />
        <small *ngIf="firstNameRef.invalid && firstNameRef.touched">Required</small>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="lastName" [(ngModel)]="lastName" #lastNameRef="ngModel" required />
        <small *ngIf="lastNameRef.invalid && lastNameRef.touched">Required</small>
      </div>
    </div>

    <!-- USERNAME + EMAIL -->
    <div class="form-row">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" [(ngModel)]="username" #usernameRef="ngModel" required minlength="6" />
        <small *ngIf="usernameRef.errors?.['required'] && usernameRef.touched">Required</small>
        <small *ngIf="usernameRef.errors?.['minlength']">Min 6 characters</small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="email" #emailRef="ngModel" required email />
        <small *ngIf="emailRef.invalid && emailRef.touched">Invalid email</small>
      </div>
    </div>

    <!-- PHONE -->
    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" [(ngModel)]="phone" #phoneRef="ngModel" required pattern="^[0-9]{8,15}$" />
      <small *ngIf="phoneRef.invalid && phoneRef.touched">Invalid phone</small>
    </div>

    <!-- PASSWORD -->
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="password" #passwordRef="ngModel" required minlength="6" />
      <small *ngIf="passwordRef.errors?.['minlength']">Min 6 characters</small>
      <small>Password strength: {{ passwordStrength }}</small>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" #confirmRef="ngModel" required />
      <small *ngIf="confirmPassword && password !== confirmPassword">Passwords do not match</small>
    </div>

    <div class="captcha-container">
      <re-captcha #captchaRef
                  [siteKey]="'6Leg26ssAAAAAPfRCTwtnSq6Ne9hQLPmfuNAOc5U'"
                  (resolved)="onCaptchaResolved($event)">
      </re-captcha>
    </div>

    <button type="submit" [disabled]="registerForm.invalid || password !== confirmPassword || !captchaToken || isLoading">
      {{ isLoading ? 'Creating...' : 'Create Account' }}
    </button>

    <!-- ERROR -->
    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <!-- LINK -->
    <div class="register-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>
  </form>

</div>
