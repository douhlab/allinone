<div class="layout">

  <!-- TOPBAR -->
  <app-topbar (menuClick)="toggleSidebar()"></app-topbar>

  <!-- MOBILE OVERLAY -->
  <div
    class="overlay"
    *ngIf="isSidebarOpen"
    (click)="toggleSidebar()">
  </div>

  <div class="main">

    <!-- SIDEBAR -->
    <app-sidebar
      class="sidebar"
      [isOpen]="isSidebarOpen"
      (close)="isSidebarOpen = false">
    </app-sidebar>

    <!-- CONTENT -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
