<h2 mat-dialog-title>Add Leave</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="form">

  <!-- ROW 1 -->
  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>Employer</mat-label>
      <mat-select formControlName="employer">
        <mat-option *ngFor="let e of employers$ | async" [value]="e.id">
          {{ e.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Leave Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="leaveDate">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <!-- ROW 2 -->
  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>Days</mat-label>
      <input matInput type="number" min="1" formControlName="days">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Balance</mat-label>
      <input matInput type="number" formControlName="currentBalance">
    </mat-form-field>
  </div>

  <!-- ROW 3 -->
  <div class="column">
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput rows="2" formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Note</mat-label>
      <textarea matInput rows="2" formControlName="note"></textarea>
    </mat-form-field>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
      Save
    </button>
  </div>

</form>
