ingress:
  webApplication:
    proxyBodySize: "1m"

    csp:
      private:
        all:
          default-src:
            - "'self'"
            - https://login.microsoftonline.com

          script-src:
            - "'self'"
            - "'unsafe-inline'"
            - "'unsafe-eval'"

          img-src:
            - "'self'"

          style-src:
            - "'self'"
            - "'unsafe-inline'"

          font-src:
            - "'self'"
            - https://fonts.gstatic.com
            - https://themes.googleusercontent.com

          frame-src:
            - "'self'"
            - https://login.microsoftonline.com

          object-src:
            - "'none'"

    backends:
      components:
        - component: allinone
      cors:
        credentials: true

        origins:
          - http://localhost:4200
